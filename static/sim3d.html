<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Beta Engine · 3D Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { margin: 0; background: #0e1117; color: #e6edf3; font-family: ui-sans-serif, system-ui, sans-serif; }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    .panel { padding: 16px; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; }
    .panel h1 { font-size: 18px; margin: 0 0 16px; }
    .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: #8b949e; margin: 18px 0 8px; }
    .panel label { display: block; font-size: 12px; color: #8b949e; margin-top: 8px; }
    .panel input, .panel select, .panel button { font: inherit; padding: 6px 8px; box-sizing: border-box; width: 100%; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; }
    .panel button { cursor: pointer; background: #238636; border-color: #238636; color: white; margin-top: 10px; }
    .panel button:hover { background: #2ea043; }
    .panel button.secondary { background: #21262d; border-color: #30363d; color: #e6edf3; }
    .panel button.secondary:hover { background: #30363d; }
    .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .moves button { margin: 0; padding: 8px 4px; font-size: 12px; }
    .status { margin-top: 12px; padding: 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; font-size: 11px; color: #8b949e; line-height: 1.5; font-family: ui-monospace, Menlo, monospace; }
    #canvas { width: 100%; height: 100vh; display: block; }
    .limb-row { display: grid; grid-template-columns: 36px 1fr; gap: 4px; align-items: center; margin-top: 4px; font-size: 12px; }
    .limb-row span { font-family: ui-monospace, Menlo, monospace; color: #8b949e; }
    .limb-row select { padding: 4px 6px; }
  </style>
</head>
<body>
<div class="layout">
  <div class="panel">
    <h1>3D Climbing Simulator</h1>
    <p style="font-size: 12px; color: #8b949e; line-height: 1.5;">
      MuJoCo-driven 3D physics. The editor at <a href="/" style="color: #58a6ff;">/</a> defines the wall;
      this page lets you watch the climber hang from it and execute moves.
    </p>

    <h2>Wall</h2>
    <select id="wall-select"></select>

    <h2>Climber</h2>
    <label>Height (cm)</label>
    <input type="number" id="height" value="175" step="1" min="120" max="220" />
    <label>Wingspan (cm)</label>
    <input type="number" id="wingspan" value="175" step="1" min="120" max="240" />
    <label>Mass (kg)</label>
    <input type="number" id="mass" value="70" step="1" min="30" max="150" />

    <button id="start-btn">Start session</button>
    <button class="secondary" id="reset-btn" disabled>Re-seed pose</button>
    <button class="secondary" id="demo-btn" disabled>Demo fake moves</button>

    <h2>Move a limb</h2>
    <div id="limb-controls" style="font-size: 12px; color: #8b949e;">Start a session first.</div>

    <h2>Auto-step</h2>
    <button class="secondary" id="step1">Step 0.1 s</button>
    <button class="secondary" id="step10">Step 1.0 s</button>
    <button class="secondary" id="play">▶ Live (60 Hz)</button>

    <h2>Status</h2>
    <div class="status" id="status">No session.</div>
  </div>
  <canvas id="canvas"></canvas>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/static/sim3d.js"></script>
</body>
</html>
